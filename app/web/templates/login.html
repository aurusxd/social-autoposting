{% extends "base.html" %}
{% block title %}Вход · {{ site_name }}{% endblock %}

{% block body %}
<div class="login-shell">
  <form class="card login-card" method="post" action="/login">
    <h1 class="login-title">📮 {{ site_name }}</h1>
    <p class="login-subtitle">Панель управления публикациями</p>

    {% if error %}
    <p class="alert alert-error" role="alert">{{ error }}</p>
    {% endif %}

    <label class="field">
      <span class="field-label">Логин</span>
      <input class="input" type="text" name="username" autocomplete="username" autofocus required>
    </label>

    <label class="field">
      <span class="field-label">Пароль</span>
      <input class="input" type="password" name="password" autocomplete="current-password" required>
    </label>

    <button class="button button-primary button-block" type="submit">Войти</button>
  </form>
</div>
{% endblock %}
