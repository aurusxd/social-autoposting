name: social-autoposting

x-app: &app
  build:
    context: .
  image: social-autoposting:latest
  env_file:
    - .env
  environment:
    CELERY_BROKER_URL: redis://redis:6379/0
    DATABASE_URL: sqlite:////app/data/app.db
    TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081
    TELEGRAM_API_LOCAL: "true"
    TELEGRAM_API_SERVER_FILES_PATH: /var/lib/telegram-bot-api
    TELEGRAM_API_CLIENT_FILES_PATH: /var/lib/telegram-bot-api
  volumes:
    - app_data:/app/data
    - app_media:/app/media
    - telegram_bot_api_data:/var/lib/telegram-bot-api:ro
    - ./config.yaml:/app/config.yaml:ro
  group_add:
    - "101"
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.2
    env_file:
      - .env
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?TELEGRAM_API_ID is required}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?TELEGRAM_API_HASH is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    expose:
      - "8081"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- "http://127.0.0.1:8081/bot$${TELEGRAM_BOT_TOKEN}/getMe" | grep -q '"ok":true'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  worker:
    <<: *app
    command:
      - celery
      - -A
      - app.worker.celery_app:celery
      - worker
      - --loglevel=INFO
      - --concurrency=1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      telegram-bot-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.worker.celery_app:celery inspect ping --destination "celery@$$HOSTNAME" --timeout=5
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

  bot:
    <<: *app
    command: ["python", "main.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      telegram-bot-api:
        condition: service_healthy

volumes:
  app_data:
  app_media:
  redis_data:
  telegram_bot_api_data:
