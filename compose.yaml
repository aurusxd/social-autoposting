name: social-autoposting

x-app: &app
  build:
    context: .
  image: social-autoposting:latest
  env_file:
    - .env
  environment:
    CELERY_BROKER_URL: redis://redis:6379/0
    DATABASE_URL: sqlite:////app/data/app.db
    TELEGRAM_API_BASE_URL: http://telegram-bot-api:8081
    TELEGRAM_API_LOCAL: "true"
    TELEGRAM_API_SERVER_FILES_PATH: /var/lib/telegram-bot-api
    TELEGRAM_API_CLIENT_FILES_PATH: /var/lib/telegram-bot-api
    WHATSAPP_API_URL: http://openwa:2785/api
    WHATSAPP_MEDIA_BASE_URL: http://media-server
    WHATSAPP_MEDIA_ROOT: /app/media
  volumes:
    - app_data:/app/data
    - app_media:/app/media
    - telegram_bot_api_data:/var/lib/telegram-bot-api:ro
    - ./config.yaml:/app/config.yaml:ro
  group_add:
    - "101"
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  init-app-volumes:
    <<: *app
    user: "0:0"
    command:
      - sh
      - -c
      - chown -R 10001:10001 /app/data /app/media
    restart: "no"

  media-server:
    image: nginx:alpine
    volumes:
      - app_media:/usr/share/nginx/html:ro
    expose:
      - "80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  openwa:
    image: ghcr.io/rmyndharis/openwa:0.11.1
    environment:
      NODE_ENV: production
      PORT: "2785"
      NODE_ID: openwa-single
      API_MASTER_KEY: ${WHATSAPP_API_KEY:?WHATSAPP_API_KEY is required}
      ENGINE_TYPE: ${OPENWA_ENGINE_TYPE:-baileys}
      AUTO_START_SESSIONS: "true"
      BAILEYS_MARK_ONLINE_ON_CONNECT: "false"
      SERVE_DASHBOARD: "true"
      CSP_UPGRADE_INSECURE_REQUESTS: "false"
      SSRF_ALLOWED_HOSTS: media-server
      MEDIA_DOWNLOAD_MAX_BYTES: ${WHATSAPP_MEDIA_MAX_BYTES:-104857600}
      BODY_SIZE_LIMIT: ${OPENWA_BODY_SIZE_LIMIT:-140mb}
      INFLIGHT_BODY_BUDGET_BYTES: ${OPENWA_INFLIGHT_BODY_BUDGET_BYTES:-587202560}
    volumes:
      - openwa_data:/app/data
    ports:
      - "${OPENWA_BIND_HOST:-127.0.0.1}:${OPENWA_PORT:-2785}:2785"
    depends_on:
      media-server:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:2785/api/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    stop_grace_period: 45s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.2
    env_file:
      - .env
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?TELEGRAM_API_ID is required}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?TELEGRAM_API_HASH is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    expose:
      - "8081"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- "http://127.0.0.1:8081/bot$${TELEGRAM_BOT_TOKEN}/getMe" | grep -q '"ok":true'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      init-app-volumes:
        condition: service_completed_successfully
    restart: "no"

  worker:
    <<: *app
    command:
      - celery
      - -A
      - app.worker.celery_app:celery
      - worker
      - --loglevel=INFO
      - --concurrency=1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      telegram-bot-api:
        condition: service_healthy
      openwa:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.worker.celery_app:celery inspect ping --destination "celery@$$HOSTNAME" --timeout=5
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

  bot:
    <<: *app
    command: ["python", "main.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      telegram-bot-api:
        condition: service_healthy

volumes:
  app_data:
  app_media:
  redis_data:
  telegram_bot_api_data:
  openwa_data:
