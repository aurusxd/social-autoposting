name: social-autoposting

x-app: &app
  build:
    context: .
  image: social-autoposting:latest
  env_file:
    - .env
  environment:
    CELERY_BROKER_URL: redis://redis:6379/0
    DATABASE_URL: sqlite:////app/data/app.db
  volumes:
    - app_data:/app/data
    - app_media:/app/media
    - ./config.yaml:/app/config.yaml:ro
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  worker:
    <<: *app
    command:
      - celery
      - -A
      - app.worker.celery_app:celery
      - worker
      - --loglevel=INFO
      - --concurrency=1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.worker.celery_app:celery inspect ping --destination "celery@$$HOSTNAME" --timeout=5
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

  bot:
    <<: *app
    command: ["python", "main.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  app_data:
  app_media:
  redis_data:
