upstream panel {
    server panel:8000;
}

# Large videos travel through nginx on their way to Telegram, so the body
# limit and the timeouts have to match what the panel itself accepts
# (WEB_MAX_UPLOAD_BYTES, 2000 MB by default).
client_max_body_size 2000m;
client_body_timeout 600s;
proxy_read_timeout 600s;
proxy_send_timeout 600s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Certbot writes its challenge files here; keep this before any redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uncomment once a certificate exists, then reload nginx.
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    location / {
        proxy_pass http://panel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
    }
}

