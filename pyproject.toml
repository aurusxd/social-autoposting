[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "social-autoposting"
version = "0.1.0"
description = "Web control panel for a social cross-posting service"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12,<4",
    "aiogram>=3.20,<4",
    "alembic>=1.19.1",
    "celery>=5.6.3",
    "fastapi>=0.115,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "loguru>=0.7,<1",
    "python-multipart>=0.0.20",
    "PyYAML>=6.0,<7",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.34,<1",
    "aiohttp-socks>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["tech.md", "app/database/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]
