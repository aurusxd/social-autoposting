[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "social-autoposting"
version = "0.1.0"
description = "Telegram UI for a social cross-posting bot"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20,<4",
    "alembic>=1.19.1",
    "celery>=5.6.3",
    "instagrapi[video]>=2.18.16,<3",
    "loguru>=0.7,<1",
    "PyYAML>=6.0,<7",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["tech.md", "app/database/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]
